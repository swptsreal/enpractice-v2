<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ôn flashcard SRS · EN Practice v2</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" />
<style>
.flash { background: var(--surface); border: 2px solid var(--border-strong); border-radius: var(--r-hero); padding: 24px; box-shadow: 0 6px 0 -2px var(--border), 0 20px 40px -28px rgb(20 35 43 / .35); text-align: left; }
.flash__face { text-align: center; padding: 28px 0 8px; }
.flash__example { margin-top: 16px; padding: 14px 16px; background: var(--surface-alt); border-radius: var(--r-card); }
.flash__example mark { background: color-mix(in srgb, var(--amber) 42%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.srs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.srs__btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; padding: 8px; border: 2px solid var(--border-strong); border-radius: var(--r-control); background: var(--surface); cursor: pointer; box-shadow: 0 4px 0 0 var(--border-strong); transition: transform 90ms var(--ease-out), box-shadow 90ms var(--ease-out); }
.srs__btn:active { transform: translateY(4px); box-shadow: 0 0 0 0 var(--border-strong); }
.srs__btn--wrong { border-color: var(--wrong); box-shadow: 0 4px 0 0 var(--wrong); }
.srs__btn--hard { border-color: var(--attention); box-shadow: 0 4px 0 0 var(--attention); }
.srs__btn--good { border-color: var(--teal); box-shadow: 0 4px 0 0 var(--teal-strong); }
.srs__btn--easy { border-color: var(--correct); box-shadow: 0 4px 0 0 var(--correct); }
@media (max-width: 479px) { .srs { grid-template-columns: repeat(2, 1fr); } .take__foot-inner > .t-micro { display: none; } }
</style>
</head>
<body>
<a class="sr-only" href="#main">Bỏ qua tới nội dung</a>

<div class="take">
    <header class="take__bar">
        <button class="btn btn--ghost btn--icon btn--sm" type="button" aria-label="Thoát"><svg class="" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="grow" style="max-width:520px"><div class="bar" role="progressbar" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100">
        <div class="bar__fill bar__fill--amber" style="width:33%"></div>
    </div></div>
        <span class="t-micro mono muted">4 / 12</span>
    </header>

    <main class="take__main" id="main" style="max-width:720px">
        <!-- The card. Face is the prompt, not a definition. -->
        <article class="flash" aria-live="polite">
            <div class="between">
                <span class="chip chip--outline">Environment</span>
                <button class="btn btn--ghost btn--sm" type="button"><svg class="" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true"><path d="M4.5 15v-2a7.5 7.5 0 0 1 15 0v2"/><rect x="3" y="14" width="4" height="6" rx="2"/><rect x="17" y="14" width="4" height="6" rx="2"/></svg> Nghe</button>
            </div>

            <div class="flash__face">
                <h1 class="t-display" style="font-family:var(--font-display)">mitigate</h1>
                <span class="mono muted">/ˈmɪtɪɡeɪt/</span>
            </div>

            <div class="flash__example">
                <span class="t-micro muted">Ví dụ của bạn</span>
                <p class="t-body-lg" style="margin-top:2px">Governments can <mark>mitigate</mark> air pollution by investing in public transport.</p>
            </div>

            <div class="flash__answer" id="answer" hidden>
                <div class="hr" style="margin:16px 0"></div>
                <span class="t-micro muted">Nghĩa</span>
                <p class="t-h3" style="margin-top:2px">làm giảm bớt mức độ nghiêm trọng</p>
                <p class="t-body soft" style="margin-top:8px">Đi với tác động tiêu cực cần giảm bớt — không đi với một việc tốt.</p>
            </div>

            <div class="row g12" style="justify-content:center;margin-top:20px">
                <button class="btn btn--primary btn--lg" type="button" data-reveal="answer" data-announce="Đã hiện nghĩa của mitigate">Hiện nghĩa</button>
            </div>
        </article>
    </main>

    <!-- 4 levels of recall: bigger than 44px, colour + label, not colour alone -->
    <footer class="take__foot">
        <div class="take__foot-inner" style="max-width:720px">
            <span class="t-micro muted hide-lg" style="flex:0 0 auto">Bạn nhớ từ này ở mức nào?</span>
            <div class="srs">
                
                    <button class="srs__btn srs__btn--again" type="button" data-select data-announce="Đã ghi mức Quên · từ này sẽ quay lại theo lịch ngắn hơn">
                        <span class="t-label">Quên</span>
                        <span class="t-micro muted"><1 ngày</span>
                    </button>
                    <button class="srs__btn srs__btn--hard" type="button" data-select data-announce="Đã ghi mức Khó · từ này sẽ quay lại theo lịch ngắn hơn">
                        <span class="t-label">Khó</span>
                        <span class="t-micro muted">2 ngày</span>
                    </button>
                    <button class="srs__btn srs__btn--good" type="button" data-select data-announce="Đã ghi mức Được · từ này sẽ quay lại theo lịch ngắn hơn">
                        <span class="t-label">Được</span>
                        <span class="t-micro muted">5 ngày</span>
                    </button>
                    <button class="srs__btn srs__btn--easy" type="button" data-select data-announce="Đã ghi mức Dễ · từ này sẽ quay lại theo lịch ngắn hơn">
                        <span class="t-label">Dễ</span>
                        <span class="t-micro muted">12 ngày</span>
                    </button>
            </div>
        </div>
    </footer>
</div>
<div id="live" class="sr-only" role="status" aria-atomic="true"></div>
<script>
/* A mockup that cannot be pressed cannot be judged, so the interactions that
   carry the design — tab switching, answer selection, switch toggles, revealing
   a verdict — are live. Tab panels are keyed off data-panel, which is also what
   the aria-controls wiring documents, so the mockup and the accessibility tree
   cannot disagree. Plain <script>, no module, so file:// works. */
(function () {
    var live = document.getElementById('live');
    function announce(text) { if (live) live.textContent = text; }

    document.addEventListener('click', function (e) {
        var tab = e.target.closest('[data-tab]');
        if (tab) {
            var group = tab.closest('[data-tabs]');
            group.querySelectorAll('[data-tab]').forEach(function (t) {
                t.setAttribute('aria-selected', String(t === tab));
            });
            var scope = group.dataset.tabs;
            document.querySelectorAll('[data-panel^="' + scope + '-"]').forEach(function (p) {
                p.hidden = p.dataset.panel !== tab.dataset.tab;
            });
            return;
        }
        var sel = e.target.closest('[data-select]');
        if (sel) {
            var box = sel.closest('[data-group]');
            if (box) box.querySelectorAll('[data-select]').forEach(function (s) {
                s.setAttribute('aria-pressed', String(s === sel));
            });
            announce(sel.dataset.announce || 'Đã chọn');
            return;
        }
        var tog = e.target.closest('[data-toggle]');
        if (tog) {
            var on = (tog.getAttribute('aria-checked') || tog.getAttribute('aria-pressed')) === 'true';
            tog.setAttribute('aria-checked', String(!on));
            tog.setAttribute('aria-pressed', String(!on));
            return;
        }
        var reveal = e.target.closest('[data-reveal]');
        if (reveal) {
            var el = document.getElementById(reveal.dataset.reveal);
            if (el) {
                el.hidden = false;
                el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                announce(reveal.dataset.announce || '');
            }
        }
    });
})();
</script>
</body>
</html>
