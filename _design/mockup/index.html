<!doctype html>

<head>
<meta charset="utf-8" />

<title>EN Practice v2 — Mockup Explorer</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" />
<style>
    body { background: var(--canvas); }
    .studio { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    @media (max-width: 900px) { .studio { grid-template-columns: 1fr; } }

    /* ---------------------------------------------------------- rail */
    .rail {
        border-right: 2px solid var(--border);
        background: var(--surface);
        display: flex; flex-direction: column;
        max-height: 100vh; position: sticky; top: 0;
    }
    @media (max-width: 900px) { .rail { position: static; max-height: none; } }
    .rail__head { padding: 18px 18px 12px; border-bottom: 2px solid var(--border); }
    .rail__body { overflow-y: auto; padding: 12px 12px 32px; flex: 1; }
    .rail__group { padding: 14px 8px 6px; font-size: .6875rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
    .rail__link {
        display: flex; align-items: center; gap: 10px;
        min-height: 40px; padding: 0 10px; border-radius: var(--r-sm);
        color: var(--ink-soft); font-size: .875rem; font-weight: 700; cursor: pointer;
        border: 0; background: transparent; width: 100%; text-align: left;
    }
    .rail__link:hover { background: var(--surface-alt); color: var(--ink); }
    .rail__link[aria-current='true'] { background: var(--teal-soft); color: var(--teal); }
    .rail__num { font-family: var(--font-mono); font-size: .6875rem; color: var(--ink-faint); min-width: 20px; }
    .rail__link[aria-current='true'] .rail__num { color: var(--teal); }

    /* -------------------------------------------------------- canvas */
    .stage { display: flex; flex-direction: column; min-width: 0; }
    .bar {
        position: sticky; top: 0; z-index: 20;
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 12px 18px; background: var(--surface);
        border-bottom: 2px solid var(--border);
    }
    .viewport { flex: 1; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
    .frame {
        width: 100%; max-width: var(--frame-w, 1440px);
        background: var(--surface);
        border: 2px solid var(--border-strong);
        border-radius: var(--r-hero);
        overflow: hidden;
        box-shadow: 0 8px 0 -2px var(--border), 0 24px 48px -24px rgb(20 35 43 / .35);
        transition: max-width var(--m-base) var(--ease-out);
    }
    .frame iframe { display: block; width: 100%; height: 78vh; min-height: 620px; border: 0; background: var(--canvas); }
    .meta { padding: 12px 18px; border-top: 2px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .meta code { font-family: var(--font-mono); font-size: .8125rem; color: var(--teal); }

    .segmented button { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 4px; border: 2px solid rgb(0 0 0 / .15); }
</style>
</head>

const rail = document.getElementById('rail');
const view = document.getElementById('view');
const openLink = document.getElementById('open');
const titleEl = document.getElementById('title');
const pathEl = document.getElementById('path');
const noteEl = document.getElementById('note');
const frame = document.getElementById('frame');

let current = SCREENS[0];
let groups = [];
for (const s of SCREENS) {
    if (!groups.includes(s.g)) groups.push(s.g);
}

rail.innerHTML = groups.map((g) => `
    <div class="rail__group">${g}</div>
    ${SCREENS.map((s, i) => ({ ...s, i }))
        .filter((s) => s.g === g)
        .map((s) => `<button class="rail__link" type="button" data-f="${s.f}">
            <span class="rail__num">${String(s.i + 1).padStart(2, '0')}</span>
            <span class="grow truncate">${s.t}</span>
        </button>`).join('')}
`).join('');

function select(file, { push = true } = {}) {
    const screen = SCREENS.find((s) => s.f === file) || SCREENS[0];
    current = screen;
    view.src = `${screen.f}.html`;
    openLink.href = `${screen.f}.html`;
    titleEl.textContent = `${String(SCREENS.indexOf(screen) + 1).padStart(2, '0')} · ${screen.t}`;
    pathEl.textContent = `${screen.f}.html`;
    noteEl.textContent = screen.n;
    rail.querySelectorAll('.rail__link').forEach((b) => {
        b.setAttribute('aria-current', String(b.dataset.f === screen.f));
    });
    if (push) history.replaceState(null, '', `#${screen.f}`);
}

rail.addEventListener('click', (e) => {
    const btn = e.target.closest('.rail__link');
    if (btn) select(btn.dataset.f);
});

/* device width */
document.querySelectorAll('[data-w]').forEach((btn) => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-w]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
        btn.setAttribute('aria-pressed', 'true');
        frame.style.setProperty('--frame-w', `${btn.dataset.w}px`);
    });
});

/* theme: tokens.css declares light AND dark via native light-dark(), so one
   `color-scheme` value flips the entire product. The local screens are
   same-origin (including over file://), so the frame is driven directly. */
let theme = 'light';
function applyTheme(next) {
    theme = next;
    document.documentElement.style.colorScheme = theme;
    document.querySelectorAll('[data-theme]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b.dataset.theme === theme));
    });
    try {
        view.contentDocument.documentElement.style.colorScheme = theme;
    } catch (err) { /* cross-origin frame: not expected for local screens */ }
}
document.querySelectorAll('[data-theme]').forEach((btn) => {
    btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
});
view.addEventListener('load', () => {
    try {
        view.contentDocument.documentElement.style.colorScheme = theme;
    } catch (err) { /* ignore */ }
});

document.getElementById('reload').addEventListener('click', () => { view.src = view.src; });

const initial = location.hash.replace('#', '');
select(SCREENS.some((s) => s.f === initial) ? initial : SCREENS[0].f, { push: false });
applyTheme('light');
